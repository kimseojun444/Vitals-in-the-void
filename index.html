,"dir":"both","gs":1,"dp":1,"lim":{"wl":32,"wh":36},"on":5,"fx":"MCHC","al":[]},{"id":"homa","n":"HOMA-IR","u":"index","c":["metab"],"inv":1,"f":"calc","b":1.56,"tol":0.4,"s":0,"l":0,"dir":"hi","gs":1,"dp":2,"lim":{"wh":2.5,"ch":4},"on":5,"fx":"HOMA","s2":"Fasting Insulin & HOMA-IR","al":[]},{"id":"eva_prebreathe","n":"Prebreathe protocol completed","u":"%","c":["eva"],"inv":0,"f":"eva","b":100,"tol":2,"s":0,"l":0,"dir":"lo","gs":0,"dp":0,"lim":{"cl":99.5},"on":5,"how":"Percent of the prescribed oxygen prebreathe actually completed before depress.","al":["prebreathe"]},{"id":"eva_co2","n":"Suit inspired CO₂","u":"mmHg","c":["eva"],"inv":0,"f":"eva","b":2,"tol":3,"s":0,"l":0,"dir":"hi","gs":0,"dp":1,"lim":{"wh":7.6,"ch":23},"on":5,"how":"Peak inspired CO₂ from suit telemetry during the EVA.","al":["suit co2","co2"]},{"id":"eva_hrpct","n":"Peak EVA heart rate","u":"% of max","c":["eva"],"inv":0,"f":"eva","b":65,"tol":10,"s":0,"l":0,"dir":"hi","gs":0,"dp":0,"lim":{"wh":85,"ch":95},"on":5,"how":"Peak heart rate during the EVA divided by age-predicted maximum (220 − age).","al":["eva heart rate"]},{"id":"eva_temp","n":"Peak core temperature in suit","u":"°C","c":["eva"],"inv":0,"f":"eva","b":37.4,"tol":0.4,"s":0,"l":0,"dir":"hi","gs":0,"dp":1,"lim":{"wh":38.3,"ch":39.0},"on":5,"how":"Core temperature sensor peak during the EVA.","al":["suit temperature"]},{"id":"eva_o2end","n":"Suit oxygen left at end","u":"%","c":["eva"],"inv":0,"f":"eva","b":40,"tol":15,"s":0,"l":0,"dir":"lo","gs":0,"dp":0,"lim":{"wl":20,"cl":10},"on":5,"how":"Usable oxygen remaining at repress, from suit telemetry.","al":["oxygen remaining"]},{"id":"eva_hand","n":"Hand / finger pain after EVA","u":"/10","c":["eva"],"inv":0,"f":"eva","b":0,"tol":1.2,"s":0,"l":0,"dir":"hi","gs":0,"dp":0,"lim":{"wh":3,"ch":7},"on":5,"how":"Pain score after glove removal, 0 = none.","al":["hand pain","finger pain"]},{"id":"eva_nail","n":"Fingernail lifting (onycholysis)","u":"","c":["eva"],"inv":0,"f":"eva","b":0,"tol":0.4,"s":0,"l":0,"dir":"hi","gs":0,"dp":0,"lim":{"wh":0.5},"on":5,"how":"1 if any nail is lifting or bruised under the nail after the EVA.","al":["fingernail","nail"]},{"id":"eva_shoulder","n":"Shoulder pain after EVA","u":"/10","c":["eva"],"inv":0,"f":"eva","b":0,"tol":1.2,"s":0,"l":0,"dir":"hi","gs":0,"dp":0,"lim":{"wh":3,"ch":7},"on":5,"how":"Pain score, worse side, 0 = none.","al":["shoulder pain"]},{"id":"eva_dcs","n":"Decompression sickness signs","u":"grade","c":["eva"],"inv":0,"f":"eva","b":0,"tol":0.3,"s":0,"l":0,"dir":"hi","gs":0,"dp":0,"lim":{"ch":0.5},"on":5,"how":"0 = none; 1 = joint pain, skin itch or mottling; 2 = numbness, weakness, confusion or vision change.","al":["decompression","dcs","bends"]},{"id":"eva_hours7","n":"EVA hours in last 7 days","u":"h","c":["eva"],"inv":0,"f":"eva","b":6,"tol":12,"s":0,"l":0,"dir":"hi","gs":0,"dp":1,"lim":{"wh":24,"ch":32},"on":5,"how":"Total suited EVA time in the past week (exploration plans allow up to 24 h).","al":["eva hours"]},{"id":"eva_rest","n":"Rest days since previous EVA","u":"d","c":["eva"],"inv":0,"f":"eva","b":7,"tol":10,"s":0,"l":0,"dir":"lo","gs":0,"dp":0,"lim":{"wl":4,"cl":1},"on":5,"how":"Days since the previous EVA (ISS practice: at least 4–5).","al":["rest days"]}],"CONDS":[{"id":"sans","n":"Spaceflight-Associated Neuro-ocular Syndrome (SANS)","short":"Eyes (SANS)","reg":"eyes","haz":["Altered gravity","Hostile closed environment (CO₂)"],"info":"Without gravity about 1.5–2 L of fluid moves toward the head. Pressure around the optic nerve rises, the back of the eye flattens and the optic disc can swell, giving a far-sighted shift. It affects roughly 70% of long-duration crew and grows with mission length.","act":["Do the daily Amsler grid and near-vision card; report any new blur or distortion.","Wear the adjustable-focus (“superfocus”) glasses for a far-sighted shift.","Avoid long periods of straining, head-down positions and tight collars.","Ask the flight surgeon about thigh cuffs or lower-body negative pressure sessions if available.","Keep B-vitamin intake as planned and track cabin CO₂ (a known headache trigger)."],"esc":"Optic nerve sheath or retinal thickness above your trajectory, a far-sighted shift over 1 D, or headache with vision change: schedule OCT/ultrasound and send to the flight surgeon at the next pass.","ref":["lee2020","zwart2016","law2014"]},{"id":"cv","n":"Cardiovascular deconditioning & arrhythmias","short":"Heart","reg":"heart","haz":["Altered gravity","Space radiation","Isolation & confinement (stress)"],"info":"Blood volume falls 10–15% within days, the heart works against less load and slowly deconditions. Rhythm changes such as extra beats (PVCs) become more common on long missions. The main operational risk is fainting when gravity returns (landing, planetary surface, EVA).","act":["Complete daily aerobic exercise (cycle/treadmill) plus resistance training.","Drink to plan; fluid- and salt-load before landing or a gravity transition as briefed.","Limit caffeine and check potassium/magnesium if extra beats rise.","Wear compression garments for re-entry and the first days in gravity."],"esc":"QTc over 500 ms, resting heart rate over 130 bpm, fainting, chest pain or palpitations with dizziness: treat as urgent and contact the Crew Medical Officer (CMO) now.","ref":["hughson2018","std3001"]},{"id":"bone","n":"Rapid bone mineral density loss","short":"Bones","reg":"bones","haz":["Altered gravity"],"info":"Weight-bearing bones (hip, spine) lose about 1–1.5% of their density each month without loading. Calcium released from bone raises urine calcium and kidney-stone risk within weeks.","act":["Do high-load resistance exercise (ARED) 6 days a week; this is the most effective countermeasure.","Take vitamin D as issued (800–1000 IU/day) and keep calcium near 1000–1200 mg/day, not more.","Keep sodium moderate: high salt raises urine calcium.","Drink enough for over 2 L of urine a day to protect against stones.","Ask about potassium citrate or a bisphosphonate if turnover markers stay high."],"esc":"Flank or back pain with blood in urine (kidney stone), urine calcium over 400 mg/day, or bone loss well ahead of trajectory: contact the flight surgeon.","ref":["smith2012","leblanc2013","whitson2009"]},{"id":"sleep","n":"Sleep cycle disruption","short":"Sleep","reg":"head","haz":["Isolation & confinement","Distance from Earth (schedules)","Hostile closed environment (noise, light)"],"info":"Crews average about 6 h of sleep against the 8.5 h scheduled, with less deep and REM sleep. Without a 24-h sunlight cycle the body clock drifts, which slows reactions and raises error risk.","act":["Protect the 8.5 h sleep window and keep a fixed wake time.","Use bright, blue-rich light after waking and dim, warm light 2 h before sleep.","Use eye mask and ear plugs; keep the sleep station cool.","No caffeine within 6 h of sleep.","Ask the flight surgeon before using melatonin or a sleep medication."],"esc":"Under 5 h of sleep for 3 nights or reaction-time lapses during critical tasks: tell the commander and flight surgeon so the schedule can be adjusted.","ref":["barger2014","brainard2016","rosekind1995"]},{"id":"fluid","n":"Cephalic fluid shift & facial edema","short":"Head fluid","reg":"neck","haz":["Altered gravity"],"info":"Headward fluid gives the puffy face, stuffy nose and full-head feeling of early flight. Jugular veins swell; in some crew the flow slows or reverses, which can lead to a clot (seen in 6 of 11 crew studied; one had a thrombus).","act":["Use saline nasal spray for congestion; keep the head of the sleep bag slightly raised.","Track headache, nasal congestion and facial puffiness in your symptom log.","Use thigh cuffs or lower-body negative pressure if issued."],"esc":"Jugular flow that is stagnant or reversed, neck swelling or pain: urgent ultrasound review with the flight surgeon. Do not start blood thinners without ground direction.","ref":["mg2019","lee2020"]},{"id":"muscle","n":"Muscle atrophy & muscle loss","short":"Muscles","reg":"muscle","haz":["Altered gravity"],"info":"Postural muscles of the calf, thigh and back shrink 10–20% and lose 20–30% of strength over six months without heavy exercise. Strength falls faster than size.","act":["Follow the resistance programme (ARED squats, heel raises, deadlifts) at prescribed loads.","Eat 1.2–1.5 g protein per kg body mass per day, spread over meals.","Log every session so the trend can be checked against your trajectory."],"esc":"Strength down more than 20% from your trajectory or new back pain with numbness: tell the flight surgeon.","ref":["english2020","smith2012"]},{"id":"metab","n":"Metabolic shift & insulin resistance","short":"Metabolism","reg":"abdomen","haz":["Altered gravity","Hostile closed environment"],"info":"Inactivity and stress hormones make muscle less sensitive to insulin. Glucose spikes after meals grow, fasting insulin rises and cholesterol can drift up on long missions.","act":["Keep exercise volume up: it is the strongest insulin sensitiser.","Choose low-sugar menu items and pair carbohydrates with protein.","Check CGM traces after meals and log the food that caused spikes."],"esc":"Fasting glucose over 126 mg/dL twice, glucose under 54 mg/dL, or HOMA-IR over 4: contact the flight surgeon.","ref":["hughson2018","ada"]},{"id":"immune","n":"Immune system dysregulation","short":"Immune","reg":"immune","haz":["Space radiation","Isolation & confinement","Hostile closed environment"],"info":"T-cell and natural-killer activity drops and inflammation markers rise. Dormant viruses (EBV, VZV, CMV, HSV) reactivate and are shed in saliva in about half of long-duration crew, sometimes causing rashes or cold sores.","act":["Keep sleep, exercise and nutrition on plan; all three support immunity.","Use hand hygiene and clean shared surfaces.","Watch for cold sores, band-like rash (shingles) or persistent fever."],"esc":"Fever with positive viral shedding, a new blistering rash, or lymphocytes under 1.0: contact the flight surgeon.","ref":["crucian2018","crucian2016"]},{"id":"skin","n":"Microbial alteration, hypersensitivity & dermatitis","short":"Skin","reg":"skin","haz":["Hostile closed environment","Space radiation"],"info":"Dry cabin air, limited washing and a changed skin microbiome cause dryness, rashes and slow-healing skin. Radiation adds to redness.","act":["Moisturise daily with the issued emollient.","Use rinse-free cleansers gently; avoid scratching.","Take a weekly skin photo of the same spot for comparison."],"esc":"Spreading rash, pus, or redness with fever: flight surgeon review.","ref":["crucian2016","mehta2022","aad"]},{"id":"rad","n":"Acute radiation sickness & cellular damage","short":"Radiation","reg":"whole","haz":["Space radiation"],"info":"Galactic cosmic rays and solar particle events (SPE) damage DNA. Dose is tracked against the NASA career limit of 600 mSv and 30-day organ limits. A large SPE can give enough dose in hours to cause nausea and a drop in lymphocytes.","act":["Follow storm-shelter procedures as soon as an SPE alert or dose-rate spike occurs.","Wear your personal dosimeter at all times.","Eat the antioxidant-rich menu items (fruits, vegetables, omega-3)."],"esc":"Dose rate over 5× expected (possible SPE): shelter now and tell the CMO. Nausea or vomiting within hours of a dose spike, or lymphocytes falling by half: medical emergency.","ref":["cucinotta","std3001"]},{"id":"anemia","n":"Spaceflight-induced anemia","short":"Blood","reg":"blood","haz":["Altered gravity"],"info":"The body destroys about 54% more red blood cells in space than on Earth, throughout the mission. Red cell mass falls ~10%, which can cause fatigue and lower exercise capacity, especially after landing.","act":["Eat the full menu; do not take iron unless the flight surgeon prescribes it (iron stores rise in flight).","Pace exercise if unusually tired and log fatigue."],"esc":"Hemoglobin under 12 g/dL, breathlessness or chest pain with exertion: contact the flight surgeon.","ref":["trudel2022"]},{"id":"vasc","n":"Endothelial dysfunction","short":"Vessels","reg":"blood","haz":["Space radiation","Altered gravity"],"info":"Arteries stiffen in space at a rate similar to 10–20 years of ageing on Earth, measured as faster pulse-wave velocity and weaker flow-mediated dilation.","act":["Keep aerobic exercise on plan.","Prefer omega-3 and polyphenol-rich foods; limit salt."],"esc":"Pulse-wave velocity over 10 m/s or flow-mediated dilation under 4%: send to the flight surgeon.","ref":["hughson2018"]},{"id":"nutr","n":"Nutrition level deficiencies","short":"Nutrition","reg":"abdomen","haz":["Distance from Earth","Isolation & confinement"],"info":"Crews often eat only 70–80% of what they need. Weight, muscle and bone loss follow, and stored food loses vitamins over time on long missions.","act":["Eat to 100% of your energy target; log every meal.","Take vitamin D as issued.","Rotate menu items to avoid menu fatigue."],"esc":"Body mass down more than 5%, or vitamin D under 20 ng/mL: contact the flight surgeon.","ref":["smithzwart"]},{"id":"endo","n":"Endocrine & thyroid alterations","short":"Hormones","reg":"neck","haz":["Isolation & confinement","Space radiation","Altered gravity"],"info":"Stress hormones (cortisol, ACTH) stay raised in flight and the daily cortisol rhythm flattens. Prolactin rises with stress and lost sleep; thyroid hormones shift slightly.","act":["Use planned stress-relief: exercise, leisure, private calls home.","Protect sleep; it lowers cortisol and prolactin."],"esc":"TSH or free T4 outside range, or cortisol over 3× your baseline: flight surgeon review.","ref":["slack2016"]},{"id":"lytes","n":"Fluid & electrolyte imbalances","short":"Fluids","reg":"kidney","haz":["Altered gravity","Hostile closed environment"],"info":"Early in flight the body sheds fluid; thirst is blunted and sodium handling changes. Dehydration raises kidney-stone risk and worsens orthostatic intolerance.","act":["Drink to keep urine specific gravity under 1.020 (pale urine).","Keep salt moderate.","Re-check electrolytes after vomiting or heavy sweating."],"esc":"Sodium under 130 or over 150 mmol/L, potassium under 3.0 or over 6.0 mmol/L: urgent flight surgeon contact.","ref":["who_ors","whitson2009"]},{"id":"hypox","n":"Hypoxia","short":"Lungs / oxygen","reg":"lungs","haz":["Hostile closed environment"],"info":"Healthy crew stay at 97–99% oxygen saturation in flight. A drop points to a cabin atmosphere fault (ECLSS), a suit issue or a lung problem.","act":["Re-seat the probe and re-measure at rest.","Check cabin O₂ and CO₂ readings with the crew.","Use supplemental oxygen as per protocol if below 90%."],"esc":"SpO₂ under 90%: emergency. Put on oxygen and alert the CMO and commander.","ref":["std3001","medkit"]},{"id":"behav","n":"Behavioural health (added: NASA HRP behavioural risk)","short":"Mind","reg":"head","haz":["Isolation & confinement","Distance from Earth"],"info":"Isolation, confinement, workload and delayed contact with home can lower mood, raise stress and slow thinking. NASA lists adverse behavioural conditions as a top risk for Mars missions. Not in the original sheets: added because the challenge names mood as an indicator.","act":["Do the daily mood and stress check-in honestly.","Use private family and psychological conferences.","Schedule leisure, exercise and crew meals."],"esc":"Mood 3 or lower for 3 days, or thoughts of self-harm: talk to the CMO now and request a private psychological conference.","ref":["slack2016"]},{"id":"eva","n":"Risk of injury and compromised performance from spacewalks (EVA)","short":"Spacewalk (EVA)","reg":"limbs","haz":["Hostile closed environment (suit)","Altered gravity","Distance from Earth"],"info":"Spacewalks put the body inside a pressurised suit for 6–9 hours. The suit causes injuries: in the U.S. programme 50 of 219 in-flight injuries came from the suit, mostly hands (fingernail lifting, abrasions) and shoulders. The low suit pressure (about 4.3 psi) can cause decompression sickness (DCS) unless nitrogen is removed by an oxygen prebreathe. Carbon dioxide build-up, heat and fatigue reduce performance. Surface EVAs on the Moon or Mars add walking, falls and suit weight; NASA rates this a red risk for surface missions.","act":["Complete the full oxygen prebreathe protocol; never shorten it.","Do a glove and suit fit check about a week before the EVA; use finger tape or liners on pressure points.","Drink from the suit drink bag; report heat, headache or breathlessness early (possible CO₂ build-up).","Plan no hard exercise on EVA days and at least 4–5 rest days between ISS EVAs; stretch shoulders and hands after.","Keep up resistance training: strength protects shoulders and helps carry a suit in partial gravity.","Report any joint pain, skin itching or mottling, numbness or weakness after the EVA at once (possible DCS)."],"esc":"Any DCS symptom: stop, repressurise (in-suit or airlock) on 100 % oxygen and call the flight surgeon now. Numbness, weakness, confusion or vision change after EVA = neurological DCS: emergency. Suit CO₂ over 23 mmHg, core temperature over 39 °C or heart rate over 95 % of maximum: terminate or pause the EVA.","ref":["eva2022","scheuring2009","opperman2010","dcs","lambertsen"]}],"ENVS":{"earth":{"n":"Earth","g":1,"dose":0.008,"src":"~3 mSv/yr background"},"leo":{"n":"Low Earth orbit (ISS)","g":0,"dose":0.6,"src":"ISS crew dosimetry 0.5–1.0 mSv/day"},"cis":{"n":"Deep-space transit","g":0,"dose":1.8,"src":"MSL-RAD cruise 1.84 mSv/day (Zeitlin 2013)"},"moon":{"n":"Lunar surface","g":0.166,"dose":1.37,"src":"Chang'e-4 LND 1.37 mSv/day (Zhang 2020)"},"mars":{"n":"Mars surface","g":0.38,"dose":0.64,"src":"Curiosity RAD 0.64 mSv/day (Hassler 2014)"}},"MISSIONS":{"iss":{"n":"ISS expedition (180 d)","ph":[["leo",180],["earth",60]]},"iss1y":{"n":"ISS one-year (340 d)","ph":[["leo",340],["earth",60]]},"artemis":{"n":"Artemis lunar surface (30 d)","ph":[["cis",5],["moon",30],["cis",5],["earth",30             var master = audioCtx.createGain();
            master.gain.setValueAtTime(0.0001, now);
            master.gain.linearRampToValueAtTime(0.045, now + 2.4);
            master.connect(audioCtx.destination);

            var filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(150, now);
            filter.Q.setValueAtTime(1.4, now);
            filter.connect(master);

            var osc1 = audioCtx.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(55, now);
            osc1.connect(filter);

            var osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(55.35, now);
            var osc2Gain = audioCtx.createGain();
            osc2Gain.gain.setValueAtTime(0.7, now);
            osc2.connect(osc2Gain);
            osc2Gain.connect(filter);

            var osc3 = audioCtx.createOscillator();
            osc3.type = 'triangle';
            osc3.frequency.setValueAtTime(82.4, now);
            var osc3Gain = audioCtx.createGain();
            osc3Gain.gain.setValueAtTime(0.22, now);
            osc3.connect(osc3Gain);
            osc3Gain.connect(filter);

            var lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.setValueAtTime(0.18, now);
            var lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(24, now);

            lfoGain.connect(filter.frequency);

            osc3.start(now);

          var starEls = document.querySelectorAll('.p-star');
          if (!starEls.length) return;

          var stars = [];
          for (var i = 0; i < starEls.length; i++) {
            var el = starEls[i];
            stars.push({
              el: el,
              depth: parseFloat(el.getAttribute('data-depth')) || 0.6,
              lag: parseFloat(el.getAttribute('data-lag')) || 2.5,
              x: 0,
              y: 0
            });
          }

          var targetX = 0, targetY = 0;
          var maxOffset = 26;
          var lastTs = performance.now();

          window.addEventListener('pointermove', function (e) {
            var vw = window.innerWidth || 1;
            var vh = window.innerHeight || 1;
            targetX = (e.clientX / vw - 0.5) * 2;
            targetY = (e.clientY / vh - 0.5) * 2;
          }, { passive: true });

          document.documentElement.addEventListener('pointerleave', function () {
            targetX = 0;
            targetY = 0;
          });

          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) lastTs = performance.now();
          });

          function tickStars(now) {
            if (heroStopped) return;
            var dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
            lastTs = now;

            for (var i = 0; i < stars.length; i++) {
              var s = stars[i];
              var goalX = targetX * maxOffset * s.depth;
              var goalY = targetY * maxOffset * s.depth;
              var ease = 1 - Math.exp(-s.lag * dt);
              s.x += (goalX - s.x) * ease;
              s.y += (goalY - s.y) * ease;
              s.el.style.transform = 'translate3d(' + s.x.toFixed(2) + 'px,' + s.y.toFixed(2) + 'px,0)';
            }

            requestAnimationFrame(tickStars);
          }

          requestAnimationFrame(tickStars);
        })();

                    speak('Hypoxia or suit hazard alert! Oxygen saturation below normal or suit carbon dioxide elevated. Check your regulator, re-seat the mask, and notify the commander at once.', '⚠️', voiceReply);
                  } else if (q.indexOf('cardiac') >= 0 || q.indexOf('heart') >= 0 || q.indexOf('faint') >= 0 || q.indexOf('dizzy') >= 0 || q.indexOf('palpitat') >= 0) {
                    speak('Cardiac alert! Heart rate or QTc irregularity detected. Stop all activity immediately, sit down, take slow breaths, and contact medical.', '❤️', voiceReply);
                  } else if (q.indexOf('breathe') >= 0 || q.indexOf('calm') >= 0 || q.indexOf('stress') >= 0 || q.indexOf('panic') >= 0 || q.indexOf('anxiety') >= 0) {
                    speak('Initiating guided breathing protocol. Inhale slowly through your nose for four seconds... hold... and exhale smoothly for four seconds. Repeat.', '🧘', voiceReply);
                  } else {
                    speak('I received: "' + trimmed + '". For safety, please check the emergency scenario protocol cards on the right or contact the Crew Medical Officer.', '🤖', voiceReply);
                  }
                };

                $$('[data-esc]').forEach(function (b) {
                  b.onclick = function () {
                    var t = b.dataset.esc;
                    if (t === 'dcs') handleQuery('decompression sickness');
                    else if (t === 'spe') handleQuery('solar particle event');
                    else if (t === 'hypox') handleQuery('hypoxia');
                    else if (t === 'cardiac') handleQuery('cardiac');
                    else if (t === 'breathe') handleQuery('breathe');
                  };
                });

                var promptIn = $('#botPrompt'), sendBtn = $('#botSend');
                if (sendBtn && promptIn) {
                  sendBtn.onclick = function () {
                    var val = promptIn.value;
                    promptIn.value = '';
                    handleQuery(val);
                  };
                  promptIn.onkeydown = function (e) {
                    if (e.key === 'Enter') {
                      var val = promptIn.value;
                      promptIn.value = '';
                      handleQuery(val);
                    }
                  };
                }

                var mb = $('#botMute');
                if (mb) {
                  mb.onclick = function () {
                    speaking = !speaking;
                    mb.textContent = speaking ? '🔊' : '🔇';
                    if (!speaking && synth) synth.cancel();
                    toast(speaking ? 'TARS voice enabled' : 'TARS voice muted');
                  };
                }

                var mic = $('#botMic');
                var wave = $('#botWave');
                var transcriptBox = $('#botTranscriptBox');
                var activeCapture = null;

                var setTranscriptStatus = function (label, text) {
                  if (!transcriptBox) return;
                  transcriptBox.classList.add('is-visible');
                  transcriptBox.innerHTML = '<strong>' + esc(label) + '</strong> ' + esc(text);
                };

                var resetWave = function () {
                  if (wave) {
                    wave.classList.remove('recording');
                    wave.querySelectorAll('span').forEach(function (sp) { sp.style.height = '6px'; });
                  }
                };

                var updateWave = function (level) {
                  if (!wave) return;
                  wave.classList.add('recording');
                  var bars = wave.querySelectorAll('span');
                  var norm = Math.min(1, Math.sqrt(Math.max(0, level)) * 2.4);
                  for (var i = 0; i < bars.length; i++) {
                    var scale = i === 2 ? 1 : (i === 1 || i === 3 ? 0.78 : 0.55);
                    bars[i].style.height = Math.round(6 + norm * 18 * scale) + 'px';
                  }
                };

                if (mic) {
                  window.addEventListener('hashchange', function onLeaveEmergency() {
                    if (location.hash !== '#emergency') {
                      if (activeCapture) {
                        activeCapture.cancel();
                        activeCapture = null;
                      }
                      resetWave();
                      window.removeEventListener('hashchange', onLeaveEmergency);
                    }
                  });

                  mic.onclick = async function () {
                    if (activeCapture) {
                      var capToStop = activeCapture;
                      activeCapture = null;
                      mic.disabled = true;
                      mic.classList.remove('recording');
                      mic.textContent = '⏳ Transcribing...';
                      setTranscriptStatus('Status:', 'Transcribing audio with Gemini...');
                      resetWave();
                      try {
                        var result = await capToStop.stop();
                        var transcript = await transcribeCapture(result);
                        if (!transcript) {
                          setTranscriptStatus('Transcript:', 'No speech detected in the recording.');
                          toast('No speech detected. Please try speaking again.');
                        } else {
                          setTranscriptStatus('Transcribed:', transcript);
                          handleQuery(transcript, 'You (transcribed)', true);
                        }
                      } catch (err) {
                        var msg = err && err.message ? err.message : 'Unable to transcribe audio.';
                        setTranscriptStatus('Transcription error:', msg);
                        toast(msg);
                      } finally {
                        mic.disabled = false;
                        mic.classList.remove('recording');
                        mic.textContent = '🎤 Speak';
                      }
                      return;
                    }

                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                      toast('Microphone audio recording is not supported in this browser.');
                      setTranscriptStatus('Unavailable:', 'Your browser does not support microphone capture. Please type your query instead.');
                      return;
                    }

                    try {
                      if (synth) synth.cancel();
                      activeCapture = await startVoiceCapture(updateWave);
                      mic.classList.add('recording');
                      mic.textContent = '⏹️ Stop';
                      setTranscriptStatus('Recording:', 'Listening from microphone… tap Stop when done.');
                      var em = $('#botEmoji');
                      if (em) em.textContent = '👂';
                    } catch (err) {
                      activeCapture = null;
                      resetWave();
                      mic.disabled = false;
                      mic.classList.remove('recording');
                      mic.textContent = '🎤 Speak';
                      var errMsg = err && err.message ? err.message : 'Microphone permission denied or unavailable.';
                      setTranscriptStatus('Microphone error:', errMsg);
                      toast('Microphone error: ' + errMsg);
                    }
                  };
                }
              }
            };
          };

          /* ---------- Bootstrap Stage 3 Shell ---------- */
          var loaded = loadDB();
          if (!loaded || !DB.crew.length) {
            Services.makeSampleCrew();
          }
          if (!DB.supplies.items.length) {
            Supplies.loadStarter(Math.max(DB.crew.length, 3));
          }

          $('#nav').innerHTML = NAV.map(function (sec) {
            return '<div class="navsec">' + sec[0] + '</div>' + sec[1].map(function (it) {
              return '<a href="#' + it[0] + '" title="' + it[1] + '">' + ICON(ICONS[it[0]]) + '<span>' + it[1] + '</span></a>';
            }).join('');
          }).join('') + '<div class="navbottom"><div class="navsec">' + NAV_BOTTOM[0] + '</div>' + NAV_BOTTOM[1].map(function (it) {
            return '<a href="#' + it[0] + '" title="' + it[1] + '">' + ICON(ICONS[it[0]]) + '<span>' + it[1] + '</span></a>';
          }).join('') + '</div>';

          var codeRedBtn = $('#sidebarCodeRed');
          if (codeRedBtn) codeRedBtn.onclick = triggerCodeRed;

          var col = false;
          try { col = localStorage.getItem('vitv-side') === '1'; } catch (e) {}
          $('#app').classList.toggle('collapsed', col);

          $('#sideToggle').onclick = function () {
            var a = $('#app');
            if (innerWidth <= 1100 && innerWidth > 720) {
              a.classList.toggle('expanded');
              syncSideScroll();
              setTimeout(syncSideScroll, 380);
              return;
            }
            a.classList.toggle('collapsed');
            try { localStorage.setItem('vitv-side', a.classList.contains('collapsed') ? '1' : '0'); } catch (e) {}
            syncSideScroll();
            setTimeout(syncSideScroll, 380);
          };
          $('#menuBtn').onclick = function () { $('#app').classList.add('mobileopen'); $('#scrim').classList.add('on'); };
          $$('#nav a').forEach(function (a) {
            a.addEventListener('click', function () {
              $('#app').classList.remove('mobileopen', 'expanded');
              if (!$('#drawer').classList.contains('on')) $('#scrim').classList.remove('on');
            });
          });
          $('#crewBtn').onclick = function (e) { e.stopPropagation(); $('#crewMenu').classList.toggle('on'); };
          document.addEventListener('click', function () { var m = $('#crewMenu'); if (m) m.classList.remove('on'); });
          $('#scrim').onclick = closeDrawer;
          $('#modal').onclick = function (e) { if (e.target && e.target.id === 'modal') closeModal(); };
          window.addEventListener('hashchange', function () { if (dashInitialized) render(); });
          window.addEventListener('resize', function () {
            if (innerWidth > 720) $('#app').classList.remove('mobileopen');
            syncSideScroll();
          });
          document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDrawer(); closeModal(); } });
          var sideEl = $('#side');
          if (sideEl) {
            sideEl.addEventListener('wheel', function (e) {
              if (sideEl.scrollHeight <= sideEl.clientHeight + 2) {
                e.preventDefault();
                sideEl.scrollTop = 0;
              }
            }, { passive: false });
          }

          (function initDashSpaceFx() {
            var cv = document.getElementById('dash-space-fx');
            if (!cv) return;
            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var ctx = cv.getContext('2d');
            if (!ctx) return;
            var W = 0, H = 0, dpr = 1;
            var mx = 0.5, my = 0.5, tx = 0.5, ty = 0.5;
            var stars = [];
            for (var i = 0; i < 64; i++) {
              stars.push({
                x: Math.random(),
                y: Math.random(),
                z: 0.35 + Math.random() * 0.9,
                r: 0.7 + Math.random() * 1.4,
                vx: (Math.random() - 0.5) * 0.000045,
                vy: (Math.random() - 0.5) * 0.000035,
                ph: Math.random() * Math.PI * 2,
                sp: 0.5 + Math.random() * 1.2
              });
            }
            function resizeFx() {
              dpr = Math.min(window.devicePixelRatio || 1, 2);
              W = window.innerWidth; H = window.innerHeight;
              cv.width = Math.max(1, Math.floor(W * dpr));
              cv.height = Math.max(1, Math.floor(H * dpr));
              ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resizeFx();
            window.addEventListener('resize', resizeFx);
            window.addEventListener('pointermove', function (e) {
              if (!W || !H) return;
              tx = e.clientX / W;
              ty = e.clientY / H;
            }, { passive: true });
            var last = performance.now();
            function tickFx(now) {
              requestAnimationFrame(tickFx);
              if (!document.body.classList.contains('dash-active') || document.hidden) return;
              var dt = Math.min(50, now - last);
              last = now;
              mx += (tx - mx) * 0.04;
              my += (ty - my) * 0.04;
              ctx.clearRect(0, 0, W, H);
              var px = (mx - 0.5) * 28, py = (my - 0.5) * 20;
              var t = now * 0.00018;

              /* Minimal slow orbital arcs */
              var cx = W * 0.80 - px * 0.45, cy = H * 0.24 - py * 0.45;
              var radii = [Math.min(W, H) * 0.16, Math.min(W, H) * 0.25, Math.min(W, H) * 0.34];
              ctx.save();
              for (var r = 0; r < radii.length; r++) {
                ctx.beginPath();
                ctx.setLineDash(r === 1 ? [4, 9] : [2, 12]);
                ctx.strokeStyle = 'rgba(210, 245, 232, ' + (0.055 - r * 0.012) + ')';
                ctx.lineWidth = 1;
                ctx.arc(cx, cy, radii[r], t * (r % 2 ? -0.35 : 0.28), t * (r % 2 ? -0.35 : 0.28) + Math.PI * 1.45);
                ctx.stroke();
                var ang = t * (0.45 - r * 0.12) + r * 2.1;
                var sx = cx + Math.cos(ang) * radii[r], sy = cy + Math.sin(ang) * radii[r];
                ctx.setLineDash([]);
                ctx.beginPath();
                ctx.fillStyle = 'rgba(220, 250, 240, 0.24)';
                ctx.arc(sx, sy, 2.1 - r * 0.3, 0, Math.PI * 2);
                ctx.fill();
              }
              ctx.restore();

              /* Subtle drifting stars & cursor constellation links */
              var curX = mx * W, curY = my * H;
              for (var i = 0; i < stars.length; i++) {
                var st2 = stars[i];
                if (!reduce) {
                  st2.x = (st2.x + st2.vx * dt + 1) % 1;
                  st2.y = (st2.y + st2.vy * dt + 1) % 1;
                }
                var x = st2.x * W - px * st2.z;
                var y = st2.y * H - py * st2.z;
                var tw = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(now * 0.0012 * st2.sp + st2.ph));
                ctx.beginPath();
                ctx.fillStyle = 'rgba(232, 248, 244, ' + (tw * 0.42).toFixed(3) + ')';
                ctx.arc(x, y, st2.r, 0, Math.PI * 2);
                ctx.fill();
                var dist = Math.hypot(x - curX, y - curY);
                if (dist < 145) {
                  ctx.beginPath();
                  ctx.strokeStyle = 'rgba(180, 240, 225, ' + ((1 - dist / 145) * 0.14).toFixed(3) + ')';
                  ctx.lineWidth = 0.8;
                  ctx.moveTo(x, y);
                  ctx.lineTo(curX, curY);
                  ctx.stroke();
                }
              }
            }
            requestAnimationFrame(tickFx);
          })();

          Services.ensureStreamTimer();
          if (!location.hash) { try { history.replaceState(null, '', '#monitor'); } catch (e) { location.hash = 'monitor'; } }
          render();
          syncSideScroll();
        }

        (function initSubheadingRotation() {
          var subEl = document.getElementById('hero-subheading');
          if (!subEl) return;
          var phrases = [
            'In a universe defined by silence, every heartbeat is a signal.',
            'Carrying the fragile rhythm of Earth into the dark.',
            'Where the pulse meets the edge of the map.',
            'Translating the language of life against the vastness of the void.',
            'Monitoring the quiet spark that outlasts the stars.',
            'The architecture of survival where gravity fades.',
            'A single thread of life, held against the infinite.',
            'Keeping watch over the human spark.',
            'Life, secured in the dark.'
          ];
          var idx = 0;
          var cycleTimer = 0;
          var swapTimer = 0;

          function scheduleNext(delayMs) {
            clearTimeout(cycleTimer);
            if (heroStopped || journeyBooted) return;
            cycleTimer = setTimeout(function () {
              if (heroStopped || journeyBooted) return;
              if (document.hidden) {
                scheduleNext(2600);
                return;
              }
              subEl.classList.add('is-leaving');
              clearTimeout(swapTimer);
              swapTimer = setTimeout(function () {
                if (heroStopped || journeyBooted) return;
                idx = (idx + 1) % phrases.length;
                subEl.classList.remove('is-leaving');
                subEl.classList.add('is-entering-start');
                subEl.textContent = phrases[idx];
                void subEl.offsetWidth;
                subEl.classList.remove('is-entering-start');
                scheduleNext(2600 + Math.round(Math.random() * 1200));
              }, 360);
            }, delayMs);
          }

          scheduleNext(3400);
        })();

        if (btn) {
          btn.addEventListener('click', launchMarsToDash);
        }

        var root = document.documentElement;
        if (!root.classList.contains('anim')) return;

        var started = false;
        function start() {
          if (started) return;
          started = true;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              root.classList.add('play');
              setTimeout(function () {
                root.classList.remove('anim', 'play');
              }, 2150);
            });
          });
        }

        var guard = setTimeout(start, 500);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            clearTimeout(guard);
            start();
          });
        }
      })();
    </script>
  </body>
</html>
