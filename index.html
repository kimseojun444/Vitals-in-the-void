      (function(){try{
        if(!window.matchMedia||!matchMedia('(prefers-reduced-motion: reduce)').matches){
          document.documentElement.classList.add('anim');
        }
      }catch(e){}})();
    </script>
    <style>
      @font-face{
        font-family:'SF Pro';
        font-style:normal;
        font-weight:400;
        font-display:swap;
        src:local('SF Pro Text'), local('SF Pro Display'), local('SF Pro');
      }
      @font-face{
        font-family:'SF Pro';
        font-style:normal;
        font-weight:700;
        font-display:swap;
        src:local('SF Pro Text Bold'), local('SF Pro Display Bold'), local('SF Pro Bold'), local('SF Pro');
      }
      @font-face{
        font-family:'SF Pro Thin';
        font-style:normal;
        font-weight:100;
        font-display:swap;
        src:local('SF Pro Display Ultralight'), local('SF Pro Display Thin'), local('SF Pro Thin'), local('SF Pro');
      }

      *, *::before, *::after { box-sizing:border-box; margin:0; padding:0 }

      :root{
        --dw:1353; --dh:1163; --gutter:0;
        --u:max(min(.72px, calc(100vh / 700)), min(calc(100vw / 1353), calc(100vh / 1163)));
        --dh-px:calc(1163 * var(--u));
        --vshift:calc(max(0px, (100vh - var(--dh-px))) * .42);
        --ink:#ffffff; --cyan:#79dce8; --cyan-logo:#5fd0e1;
        --rule:rgba(255,255,255,.23); --btn-ink:#071227;
        --font-serif:'Cinzel', Georgia, serif;
        --font-body:'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --font-logo:'Poppins', sans-serif;
      }
      @supports (height:100dvh){
        :root{
          --u:max(min(.72px, calc(100dvh / 700)), min(calc(100vw / 1353), calc(100dvh / 1163)));
          --vshift:calc(max(0px, (100dvh - var(--dh-px))) * .42);
        }
      }

      html,body{width:100%;height:100%}
      body{
        background:#04101f;
        color:var(--ink);
        font-family:var(--font-body);
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
        text-rendering:geometricPrecision;
        overflow:hidden;
      }
      body.journey-active{
        background:#000000;
        font-family:'Poppins',system-ui,sans-serif;
      }
      body:not(.journey-active) .mars-loader,
      body:not(.journey-active) .dash-screen{
        display:none;
      }
      .stage.is-exiting{
        opacity:0;
        pointer-events:none;
        transition:opacity .48s cubic-bezier(.4,0,.2,1);
      }

      .stage{position:fixed; inset:0; overflow:hidden; isolation:isolate}

      .sky{
        position:absolute;
        inset:0;
        z-index:0;
        background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260827_202133_508c64b8-a31e-4290-bdfc-1187df70e0a6.png");
        background-size:cover;
        background-position:center;
        background-repeat:no-repeat;
      }
      .sky video{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
        opacity:0;
        transition:opacity .22s linear;
      }
      .sky video.is-active{opacity:1}
      @media (prefers-reduced-motion:reduce){
        .sky video{display:none}
      }

      .dust{
        position:absolute;
        inset:0;
        z-index:1;
        width:100%;
        height:100%;
        display:block;
        pointer-events:none;
      }

      .nebula{
        position:absolute;
        inset:0;
        z-index:4;
        width:100%;
        height:100%;
        display:block;
        pointer-events:none;
        mix-blend-mode:screen;
        opacity:1;
      }
      .nebula-cursor{
        position:fixed;
        top:0;
        left:0;
        z-index:5;
        width:12px;
        height:12px;
        margin:-6px 0 0 -6px;
        border-radius:50%;
        background:#ffffff;
        mix-blend-mode:difference;
        pointer-events:none;
        opacity:0;
        transform:translate3d(-100px,-100px,0) scale(1);
        transition:opacity .24s ease;
        will-change:transform, opacity;
      }
      .nebula-cursor.is-visible{opacity:1}
      body.journey-active .nebula-cursor{display:none !important}
      @media (hover:none), (pointer:coarse), (prefers-reduced-motion:reduce){
        .nebula-cursor{display:none}
      }
      @media (prefers-reduced-motion:reduce){
        .nebula{display:none}
      }

      .star-parallax{
        position:absolute;
        inset:0;
        z-index:2;
        pointer-events:none;
        overflow:hidden;
      }
      .p-star{
        position:absolute;
        width:calc(var(--sz, 14) * var(--u));
        height:calc(var(--sz, 14) * var(--u));
        color:var(--star-col, rgba(255,255,255,.55));
        opacity:var(--op, .45);
        filter:drop-shadow(0 0 calc(6 * var(--u)) rgba(121,220,232,.42));
        will-change:transform;
      }
      .p-star svg{
        display:block;
        width:100%;
        height:100%;
        animation:star-twinkle var(--tw, 6s) ease-in-out var(--td, 0s) infinite alternate;
      }
      @keyframes star-twinkle{
        from{opacity:.55; transform:scale(.9)}
        to{opacity:1; transform:scale(1.08)}
      }
      @media (prefers-reduced-motion:reduce){
        .p-star svg{animation:none}
      }

      .ui{position:absolute; inset:0; z-index:3}

      @keyframes zero-g-float{
        0%,100%{transform:translate3d(0,0,0)}
        50%{transform:translate3d(0,calc(-10 * var(--u)),0)}
      }
      .copy{
        position:absolute;
        inset:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        padding:calc(24 * var(--u)) calc(24 * var(--u)) calc(240 * var(--u));
        pointer-events:none;
        will-change:transform;
        animation:zero-g-float 7.5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion:reduce){
        .copy{animation:none; will-change:auto}
      }
      .col{
        width:100%;
        text-align:center;
      }

      h1.title{
        font-family:var(--font-serif);
        font-weight:500;
        font-size:calc(98 * var(--u));
        line-height:1.08;
        letter-spacing:calc(3 * var(--u));
        padding-left:calc(3 * var(--u));
        color:var(--ink);
        text-wrap:balance;
      }
      .subheading{
        margin-top:calc(20 * var(--u));
        max-width:calc(960 * var(--u));
        min-height:calc(34 * var(--u));
        font-family:var(--font-body);
        font-size:calc(22 * var(--u));
        font-style:italic;
        font-weight:400;
        line-height:calc(32 * var(--u));
        letter-spacing:calc(1.2 * var(--u));
        padding-left:calc(1.2 * var(--u));
        color:rgba(255,255,255,.92);
        text-wrap:balance;
        will-change:opacity,transform,filter;
        transition:opacity .52s cubic-bezier(.16,1,.3,1), transform .52s cubic-bezier(.16,1,.3,1), filter .52s cubic-bezier(.16,1,.3,1);
      }
      .subheading.is-leaving{
        opacity:0;
        transform:translate3d(0,calc(-8 * var(--u)),0);
        filter:blur(calc(3 * var(--u)));
        transition:opacity .36s cubic-bezier(.4,0,1,1), transform .36s cubic-bezier(.4,0,1,1), filter .36s ease;
      }
      .subheading.is-entering-start{
        opacity:0;
        transform:translate3d(0,calc(8 * var(--u)),0);
        filter:blur(calc(3 * var(--u)));
        transition:none !important;
      }
      @media (prefers-reduced-motion:reduce){
        .subheading{transition:opacity .2s linear; filter:none}
        .subheading.is-leaving,.subheading.is-entering-start{transform:none; filter:none}
      }
      .cta{
        margin-top:calc(36 * var(--u));
        display:flex;
        justify-content:center;
      }
      .glass-btn{
        position:relative;
        overflow:hidden;
        isolation:isolate;
        --mx:50%;
        --my:50%;
        pointer-events:auto;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        height:calc(72 * var(--u));
        padding:calc(2 * var(--u)) calc(46 * var(--u)) 0;
        border-radius:calc(36 * var(--u));
        border:calc(1.5 * var(--u)) solid rgba(121,220,232,.55);
        background:linear-gradient(180deg, rgba(121,220,232,.28) 0%, rgba(24,96,162,.38) 100%);
        -webkit-backdrop-filter:blur(calc(14 * var(--u)));
        backdrop-filter:blur(calc(14 * var(--u)));
        box-shadow:0 calc(10 * var(--u)) calc(28 * var(--u)) calc(-6 * var(--u)) rgba(72,188,230,.42),
                   inset 0 calc(1 * var(--u)) 0 rgba(255,255,255,.38),
                   inset 0 0 calc(18 * var(--u)) rgba(121,220,232,.16);
        font-family:var(--font-body);
        font-size:calc(20 * var(--u));
        font-weight:600;
        letter-spacing:calc(.7 * var(--u));
        line-height:1;
        color:var(--ink);
        text-shadow:0 calc(1 * var(--u)) calc(4 * var(--u)) rgba(4,16,31,.45);
        cursor:pointer;
        transition:transform .28s cubic-bezier(.22,1,.36,1), background .25s ease, border-color .25s ease, box-shadow .25s ease;
      }
      .glass-btn::before{
        content:"";
        position:absolute;
        inset:0;
        z-index:-1;
        border-radius:inherit;
        pointer-events:none;
        opacity:0;
        background:radial-gradient(calc(155 * var(--u)) circle at var(--mx) var(--my), rgba(210,248,255,.42) 0%, rgba(121,220,232,.18) 42%, transparent 74%);
        transition:opacity .25s ease;
      }
      .glass-btn:hover::before{
        opacity:1;
      }
      .glass-btn:hover{
        transform:translateY(calc(-2 * var(--u)));
        border-color:rgba(121,220,232,.85);
        background:linear-gradient(180deg, rgba(121,220,232,.38) 0%, rgba(34,118,194,.46) 100%);
        box-shadow:0 calc(14 * var(--u)) calc(34 * var(--u)) calc(-4 * var(--u)) rgba(121,220,232,.52),
                   inset 0 calc(1 * var(--u)) 0 rgba(255,255,255,.5),
                   inset 0 0 calc(22 * var(--u)) rgba(121,220,232,.24);
      }
      .glass-btn:active{
        transform:translateY(0) scale(.985);
      }
      .glass-btn:focus-visible{
        outline:calc(2 * var(--u)) solid var(--cyan);
        outline-offset:calc(3 * var(--u));
      }
      @media (prefers-reduced-motion:reduce){
        .glass-btn,.glass-btn::before{transition:none}
        .glass-btn:hover,.glass-btn:active{transform:none}
      }

      /* B) TABLET */
      @media (min-width:580px) and (max-width:1030px) and (min-height:621px){
        :root{
          --gutter:0;
          --u:min(max(min(.85px, calc(100vh / 780)), min(calc(100vw / 900), calc(100vh / 1163))), 1.15px);
          --dh-px:calc(1120 * var(--u));
          --vshift:calc(max(0px, (100vh - var(--dh-px))) * .38);
        }
        @supports (height:100dvh){
          :root{
            --u:min(max(min(.85px, calc(100dvh / 780)), min(calc(100vw / 900), calc(100dvh / 1163))), 1.15px);
            --vshift:calc(max(0px, (100dvh - var(--dh-px))) * .38);
          }
        }
        .copy{padding:calc(24 * var(--u)) calc(24 * var(--u)) calc(210 * var(--u))}
        h1.title{font-size:calc(78 * var(--u))}
        .subheading{font-size:calc(20 * var(--u)); line-height:calc(28 * var(--u))}
      }

      /* C) PHONE */
      @media (max-width:579px), (max-height:620px){
        :root{
          --gutter:0;
          --u:max(min(.92px, calc(100vh / 620)), min(calc(100vw / 430), calc(100vh / 880)));
          --dh-px:calc(880 * var(--u));
          --vshift:calc(max(0px, (100vh - var(--dh-px))) * .34);
        }
        @supports (height:100dvh){
          :root{
            --u:max(min(.92px, calc(100dvh / 620)), min(calc(100vw / 430), calc(100dvh / 880)));
            --vshift:calc(max(0px, (100dvh - var(--dh-px))) * .34);
          }
        }
        .copy{padding:calc(24 * var(--u)) calc(24 * var(--u)) calc(170 * var(--u))}
        h1.title{font-size:calc(44 * var(--u)); letter-spacing:calc(1.6 * var(--u)); padding-left:calc(1.6 * var(--u))}
        .subheading{margin-top:calc(16 * var(--u)); min-height:calc(52 * var(--u)); font-size:calc(17 * var(--u)); line-height:calc(25 * var(--u))}
        .cta{margin-top:calc(28 * var(--u))}
        .glass-btn{height:calc(64 * var(--u)); padding:calc(2 * var(--u)) calc(40 * var(--u)) 0; border-radius:calc(32 * var(--u)); font-size:calc(18 * var(--u))}
      }

      /* E) SHORT */
      @media (max-height:620px){
        :root{
          --u:max(min(.85px, calc(100vh / 470)), min(calc(100vw / 640), calc(100vh / 560)));
          --dh-px:calc(560 * var(--u));
          --vshift:0px;
        }
        @supports (height:100dvh){
          :root{
            --u:max(min(.85px, calc(100dvh / 470)), min(calc(100vw / 640), calc(100dvh / 560)));
          }
        }
        .copy{padding:calc(18 * var(--u)) calc(24 * var(--u)) calc(86 * var(--u))}
        h1.title{font-size:calc(54 * var(--u))}
        .subheading{margin-top:calc(12 * var(--u)); font-size:calc(16 * var(--u)); line-height:calc(22 * var(--u))}
        .cta{margin-top:calc(20 * var(--u))}
        .glass-btn{height:calc(56 * var(--u)); padding:calc(2 * var(--u)) calc(34 * var(--u)) 0; border-radius:calc(28 * var(--u)); font-size:calc(17 * var(--u))}
      }

      /* ENTRANCE ANIMATION */
      @keyframes ent-reveal{from{transform:translateY(115%)}to{transform:translateY(0)}}
      @keyframes ent-rise{from{opacity:0;transform:translateY(var(--rise,10px))}to{opacity:1;transform:none}}
      @keyframes ent-settle{from{opacity:0;transform:translateY(var(--rise,8px)) scale(.965)}to{opacity:1;transform:none}}
      @keyframes ent-fade{from{opacity:0}to{opacity:1}}

      .anim{
        --e-expo:cubic-bezier(.16,1,.3,1);
        --e-quint:cubic-bezier(.22,1,.36,1);
        --e-slow:cubic-bezier(.4,0,.2,1);
      }
      .ent-mask,.ent-line{display:block}
      .anim .ent-mask{overflow:hidden; padding-top:.18em; margin-top:-.18em}
      .anim .ent-line{transform:translateY(115%); will-change:transform}
      .anim .subheading,.anim .glass-btn,.anim .sky,.anim .dust,.anim .star-parallax{opacity:0}
      .anim .sky,.anim .dust,.anim .star-parallax{will-change:opacity}

      .anim.play .sky{animation:ent-fade 1.6s var(--e-slow) .25s both}
      .anim.play .dust{animation:ent-fade 1.8s var(--e-slow) .35s both}
      .anim.play .star-parallax{animation:ent-fade 1.8s var(--e-slow) .42s both}
      .anim.play h1.title .ent-line{animation:ent-reveal .95s var(--e-expo) .44s both}
      .anim.play .subheading{--rise:calc(12 * var(--u)); animation:ent-rise .7s var(--e-quint) .76s both}
      .anim.play .glass-btn{--rise:calc(8 * var(--u)); animation:ent-settle .7s var(--e-quint) .96s both}

      /* ====================================================================
         STAGE 2: MARS APPROACH ANIMATION + LOADING COUNTER
         ==================================================================== */
      .mars-loader{
        position:fixed;
        inset:0;
        z-index:20;
        background:#000;
        overflow:hidden;
        opacity:0;
        transition:opacity .55s cubic-bezier(.4,0,.2,1);
      }
      body.journey-active .mars-loader{
        opacity:1;
      }
      .mars-loader.is-leaving{
        opacity:0;
        pointer-events:none;
        transition:opacity .7s cubic-bezier(.4,0,.2,1);
      }
      .mars-loader video{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
      }
      .mars-loader-shade{
        position:absolute;
        inset:auto 0 0;
        height:38%;
        background:linear-gradient(to bottom,transparent,rgba(0,0,0,.92));
        pointer-events:none;
      }
      .mars-loading-ui{
        position:fixed;
        z-index:22;
        left:50%;
        bottom:clamp(26px,4vh,40px);
        transform:translateX(-50%);
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:8px;
        pointer-events:none;
      }
      .mars-count{
        display:flex;
        align-items:flex-end;
        gap:4px;
        font-family:'SF Pro',Arial,sans-serif;
        line-height:1;
        color:#fff;
      }
      .mars-count>span:first-child{
        font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;
        font-size:clamp(48px,6vw,64px);
        font-weight:100;
      }
      .mars-count .percent{
        font-size:clamp(18px,2.2vw,24px);
        padding-bottom:4px;
      }
      .mars-loading-label{
        font-family:'Poppins',sans-serif;
        font-size:11px;
        font-weight:500;
        letter-spacing:.34em;
        text-indent:.34em;
        text-transform:uppercase;
        color:rgba(255,255,255,.68);
      }
      .mars-loading-ui.is-leaving{
        animation:mars-count-out .65s cubic-bezier(.22,1,.36,1) both;
      }
      @keyframes mars-count-out{
        to{opacity:0;filter:blur(7px);transform:translate(-50%,-24px)}
      }

      /* ====================================================================
         STAGE 3: ASTRONAUT MISSION & BIOMEDICAL DASHBOARD (LIQUID GLASS)
         ==================================================================== */
      .dash-screen{
        --bg:0 0% 4%;
        --fg:0 0% 100%;
        --muted:0 0% 62%;
        --subtle:0 0% 48%;
        --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --hf:'Poppins',system-ui,sans-serif;
        --side:248px;
        --sideMin:74px;
        --r:20px;
        --r2:14px;
        --surface:rgba(12,17,20,0.68);
        --surface2:rgba(255,255,255,0.095);
        --surface3:rgba(255,255,255,0.16);
        --bg2:rgba(8,12,15,0.78);
        --line:rgba(255,255,255,0.21);
        --line2:rgba(255,255,255,0.34);
        --text:#ffffff;
        --text2:rgba(255,255,255,0.78);
        --text3:rgba(255,255,255,0.56);
        --ok:#34c27a;
        --warn:#f5b941;
        --bad:#ef5b5b;
        --none:#5c616e;
        --primary:rgba(255,255,255,0.92);
        --primary2:rgba(255,255,255,0.78);
        --grad:linear-gradient(135deg,rgba(255,255,255,0.94),rgba(218,224,230,0.88));
        --gradSoft:rgba(255,255,255,0.12);
        --glow:rgba(255,255,255,0.24);
        --shadow:0 20px 50px -24px rgba(0,0,0,0.72);
        --ease:cubic-bezier(.22,1,.36,1);
        --fs-s:13.5px;
        position:fixed;
        inset:0;
        z-index:15;
        background:hsl(var(--bg));
        color:hsl(var(--fg));
        font-family:'Poppins',system-ui,sans-serif;
        font-size:15px;
        line-height:1.55;
        overflow:hidden;
        opacity:0;
        pointer-events:none;
        transition:opacity .85s cubic-bezier(.16,1,.3,1);
      }
      body.dash-active .dash-screen{
        opacity:1;
        pointer-events:auto;
      }
      .dash-bg-video{
        position:fixed;
        inset:0;
        z-index:0;
        width:100%;
        height:100%;
        object-fit:cover;
        pointer-events:none;
      }
      .dash-scrim{
        position:fixed;
        inset:0;
        z-index:1;
        background:radial-gradient(circle at 50% 30%, rgba(3,8,8,0.44) 0%, rgba(2,5,7,0.74) 100%);
        pointer-events:none;
      }
      .dash-space-fx{
        position:fixed;
        inset:0;
        z-index:1;
        width:100%;
        height:100%;
        display:block;
        pointer-events:none;
      }

      @layer components {
        .liquid-glass{
          appearance:none;
          -webkit-appearance:none;
          font-family:inherit;
          background:rgba(255,255,255,0.015);
          background-blend-mode:luminosity;
          backdrop-filter:blur(8px);
          -webkit-backdrop-filter:blur(8px);
          border:none;
          box-shadow:inset 0 1px 1px rgba(255,255,255,0.12);
          position:relative;
          overflow:hidden;
        }
        .liquid-glass::before{
          content:"";
          position:absolute;
          inset:0;
          border-radius:inherit;
          padding:1.25px;
          background:linear-gradient(180deg, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.14) 22%, transparent 45%, transparent 58%, rgba(255,255,255,0.14) 80%, rgba(255,255,255,0.42) 100%);
          -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          -webkit-mask-composite:xor;
          mask-composite:exclude;
          pointer-events:none;
        }
        .liquid-glass-strong{
          appearance:none;
          -webkit-appearance:none;
          font-family:inherit;
          background:rgba(12,14,16,0.38);
          background-blend-mode:luminosity;
          backdrop-filter:blur(42px);
          -webkit-backdrop-filter:blur(42px);
          border:none;
          box-shadow:0 20px 50px -24px rgba(0,0,0,0.72), inset 0 1px 1px rgba(255,255,255,0.16);
          position:relative;
          overflow:hidden;
        }
        .liquid-glass-strong::before{
          content:"";
          position:absolute;
          inset:0;
          border-radius:inherit;
          padding:1.3px;
          background:linear-gradient(180deg, rgba(255,255,255,0.48) 0%, rgba(255,255,255,0.18) 22%, transparent 44%, transparent 58%, rgba(255,255,255,0.18) 80%, rgba(255,255,255,0.48) 100%);
          -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
          -webkit-mask-composite:xor;
          mask-composite:exclude;
          pointer-events:none;
        }
      }

      /* Keyframes */
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
      @keyframes grow{from{transform:scaleX(0)}}
      @keyframes flash{30%{box-shadow:0 0 0 2px rgba(255,255,255,0.72)}}
      @keyframes ping{70%{box-shadow:0 0 0 10px rgba(239,91,91,0)}100%{box-shadow:0 0 0 0 rgba(239,91,91,0)}}
      @keyframes filled{0%{background:rgba(255,255,255,0.22)}100%{background:var(--bg2)}}
      @keyframes cond-tile-pulse{
        0%{transform:scale(0.975); box-shadow:inset 0 0 26px rgba(255,255,255,0.28)}
        55%{transform:scale(1.028)}
        100%{transform:scale(1)}
      }

      /* Typography & Helpers */
      .dash-screen *, .dash-screen *::before, .dash-screen *::after{box-sizing:border-box}
      .dash-screen .hidden{display:none!important}
      .dash-screen h1,.dash-screen h2,.dash-screen h3,.dash-screen h4{font-family:var(--hf);font-weight:600;color:#fff;margin:0;line-height:1.25}
      .dash-screen h2{font-size:clamp(19px,2vw,24px)}
      .dash-screen h3{font-size:17px;font-weight:600}
      .dash-screen h4{font-size:14.5px;font-weight:600}
      .dash-screen p{margin:0}
      .dash-screen a{color:#fff;text-decoration:underline;text-underline-offset:3px}
      .dash-screen code{font-family:var(--font-mono);font-size:0.88em;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:6px}
      .dash-screen button,.dash-screen input,.dash-screen select,.dash-screen textarea{font-family:inherit;color:inherit}
      .dash-screen button{cursor:pointer}
      .dash-screen .num,.dash-screen .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
      .dash-screen .s{font-size:13.5px}
      .dash-screen .xs{font-size:12px}
      .dash-screen .b{font-weight:600}
      .dash-screen .t2{color:var(--text2)}
      .dash-screen .t3{color:var(--text3)}
      .dash-screen .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
      .dash-screen .row.between{justify-content:space-between}
      .dash-screen .row.end{justify-content:flex-end}
      .dash-screen .grow{flex:1;min-width:0}
      .dash-screen .stack{display:flex;flex-direction:column}
      .dash-screen .gap4{gap:4px}
      .dash-screen .gap8{gap:8px}
      .dash-screen .gap12{gap:12px}
      .dash-screen .gap16{gap:16px}
      .dash-screen .section{margin-top:clamp(16px,2vw,22px)}
      .dash-screen ::-webkit-scrollbar{width:6px;height:6px}
      .dash-screen ::-webkit-scrollbar-track{background:transparent}
      .dash-screen ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:999px}

      /* App Shell: Sidebar + Sticky Topbar + Main Container */
      #app{
        position:relative;
        z-index:2;
        height:100vh;
        height:100dvh;
        overflow:hidden;
        display:grid;
        grid-template-columns:var(--side) minmax(0,1fr);
        transition:grid-template-columns .35s var(--ease);
      }
      #app.collapsed{grid-template-columns:var(--sideMin) minmax(0,1fr)}
      #side{
        position:relative;
        height:100vh;
        height:100dvh;
        background:linear-gradient(180deg,rgba(16,22,25,0.74) 0%,rgba(9,13,16,0.78) 100%);
        backdrop-filter:blur(42px) saturate(145%);
        -webkit-backdrop-filter:blur(42px) saturate(145%);
        border-right:1px solid rgba(255,255,255,0.22);
        box-shadow:inset -1px 0 0 rgba(255,255,255,0.08);
        display:flex;
        flex-direction:column;
        padding:18px 12px;
        overflow-y:hidden;
        overflow-x:hidden;
        overscroll-behavior:contain;
        z-index:6;
      }
      #side.can-scroll:hover,
      #side.can-scroll:focus-within{
        overflow-y:auto;
      }
      #side > *{flex:none}
      .sidehead{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:8px;
        padding:2px 6px 20px;
      }
      .logo{
        display:flex;
        gap:8px;
        align-items:flex-end;
        font-family:var(--hf);
        white-space:nowrap;
        overflow:hidden;
        transition:opacity .2s;
      }
      .logo b{font-weight:300;font-size:26px;letter-spacing:3px;color:#fff}
      .logo span{font-size:10px;line-height:1.1;letter-spacing:1.2px;padding-bottom:4px;color:var(--text2);text-transform:uppercase}
      .iconbtn{
        width:38px;
        height:38px;
        border-radius:12px;
        border:1px solid var(--line);
        background:rgba(255,255,255,0.05);
        display:grid;
        place-items:center;
        color:var(--text2);
        flex:none;
        transition:background .2s,color .2s,transform .3s var(--ease);
      }
      .iconbtn:hover{background:rgba(255,255,255,0.12);color:#fff}
      .iconbtn svg{width:19px;height:19px}

      #nav{display:flex;flex-direction:column;gap:3px;overflow:visible;flex:1 0 auto}
      .navbottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
      #nav a{
        display:flex;
        gap:12px;
        align-items:center;
        color:var(--text2);
        text-decoration:none;
        padding:10px 13px;
        border-radius:14px;
        font-size:14.5px;
        font-weight:500;
        white-space:nowrap;
        position:relative;
        transition:background .2s,color .2s;
      }
      #nav a svg{width:19px;height:19px;flex:none;opacity:.85}
      #nav a:hover{background:rgba(255,255,255,0.06);color:#fff}
      #nav a[aria-current=page]{
        background:rgba(255,255,255,0.13);
        color:#fff;
        box-shadow:inset 0 1px 1px rgba(255,255,255,0.22);
      }
      #nav a[aria-current=page]::before{
        content:"";
        position:absolute;
        left:-12px;
        top:9px;
        bottom:9px;
        width:4px;
        border-radius:4px;
        background:#fff;
      }
      .navsec{
        font-size:11px;
        font-weight:600;
        letter-spacing:1.3px;
        text-transform:uppercase;
        color:var(--text3);
        padding:14px 13px 6px;
        white-space:nowrap;
      }
      #app.collapsed .logo,#app.collapsed #nav a span,#app.collapsed .navsec{opacity:0;pointer-events:none}
      #app.collapsed .navsec{height:8px;padding:0}
      #app.collapsed .sidehead{justify-content:center}
      #app.collapsed #sideToggle{transform:rotate(180deg)}
      #app.collapsed .logo{width:0}

      #mainwrap{
        min-width:0;
        height:100vh;
        height:100dvh;
        display:flex;
        flex-direction:column;
        overflow:hidden;
        background:transparent;
      }
      #top{
        flex:0 0 auto;
        position:relative;
        z-index:5;
        display:flex;
        align-items:center;
        gap:14px;
        padding:13px clamp(14px,2.4vw,30px);
        background:rgba(10,15,18,0.68);
        backdrop-filter:blur(36px) saturate(145%);
        -webkit-backdrop-filter:blur(36px) saturate(145%);
        border-bottom:1px solid rgba(255,255,255,0.20);
      }
      #main{
        flex:1 1 auto;
        min-height:0;
        overflow-y:auto;
        overflow-x:hidden;
        overscroll-behavior:contain;
        scroll-behavior:auto;
      }
      #menuBtn{display:none}
      .ptitle{flex:1;min-width:0}
      .ptitle h1{font-size:clamp(19px,2vw,24px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .ptitle p{font-size:13px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

      .mpill{
        display:flex;
        align-items:center;
        gap:9px;
        padding:8px 14px;
        border-radius:999px;
        background:rgba(255,255,255,0.06);
        border:1px solid var(--line);
        font-size:13px;
        white-space:nowrap;
        backdrop-filter:blur(14px);
      }
      .mpill b{font-family:var(--font-mono);font-weight:600}

      .spill{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:7px 13px;
        border-radius:999px;
        border:1px solid rgba(239,91,91,0.42);
        background:rgba(239,91,91,0.14);
        color:#ffc2c2;
        font-size:13px;
        font-weight:600;
        white-space:nowrap;
        animation:rise .35s var(--ease);
      }
      .spill i{width:8px;height:8px;border-radius:50%;background:var(--bad);animation:ping 1.4s infinite}

      .crewsel{position:relative}
      .crewbtn{
        display:flex;
        align-items:center;
        gap:10px;
        padding:4px 13px 4px 4px;
        border-radius:999px;
        background:rgba(255,255,255,0.06);
        border:1px solid var(--line);
        color:#fff;
        min-height:44px;
        transition:border-color .2s, background .2s;
      }
      .crewbtn:hover{border-color:var(--line2);background:rgba(255,255,255,0.1)}
      .crewmenu{
        position:absolute;
        right:0;
        top:calc(100% + 8px);
        min-width:270px;
        background:rgba(12,14,18,0.88);
        backdrop-filter:blur(32px);
        -webkit-backdrop-filter:blur(32px);
        border:1px solid var(--line2);
        border-radius:16px;
        padding:6px;
        box-shadow:0 24px 54px rgba(0,0,0,0.65);
        display:none;
        animation:pop .2s var(--ease);
        z-index:20;
      }
      .crewmenu.on{display:block}
      .crewmenu button{
        display:flex;
        align-items:center;
        gap:10px;
        width:100%;
        padding:9px 10px;
        border:0;
        background:none;
        border-radius:12px;
        color:#fff;
        text-align:left;
        font-size:13.5px;
      }
      .crewmenu button:hover,.crewmenu button[aria-current=true]{background:rgba(255,255,255,0.1)}
      .av{
        width:34px;
        height:34px;
        border-radius:50%;
        display:grid;
        place-items:center;
        font-weight:600;
        font-size:12.5px;
        background:rgba(255,255,255,0.18);
        border:1px solid rgba(255,255,255,0.28);
        color:#fff;
        position:relative;
        flex:none;
      }
      .av i{
        position:absolute;
        right:-2px;
        bottom:-2px;
        width:11px;
        height:11px;
        border-radius:50%;
        border:2px solid #0c0e10;
      }

      .dash-screen main{
        padding:22px clamp(14px,2.4vw,30px) 64px;
        max-width:1440px;
        container-type:inline-size;
        container-name:main;
      }
      .page{animation:rise .4s var(--ease) both}

      @media(max-width:1100px){
        #app:not(.expanded){grid-template-columns:var(--sideMin) minmax(0,1fr)}
        #app:not(.expanded) .logo,#app:not(.expanded) #nav a span,#app:not(.expanded) .navsec{opacity:0;pointer-events:none}
        #app:not(.expanded) .logo{width:0}
        #app:not(.expanded) .sidehead{justify-content:center}
      }
      @media(max-width:720px){
        #app,#app.collapsed,#app:not(.expanded){grid-template-columns:minmax(0,1fr)}
        #side{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);transform:translateX(-105%);transition:transform .35s var(--ease);box-shadow:20px 0 60px rgba(0,0,0,0.65)}
        #app.mobileopen #side{transform:none;z-index:25;overflow-y:auto}
        #app.mobileopen #side .logo,#app.mobileopen #nav a span,#app.mobileopen .navsec{opacity:1;pointer-events:auto;width:auto}
        #sideToggle{display:none}
        #menuBtn{display:grid}
        .mpill .hide-s{display:none}
        .crewbtn .cname{display:none}
        .ptitle p{display:none}
        .spill span{display:none}
        .spill{padding:8px}
      }

      /* Liquid Glass Surfaces & Controls */
      .card{
        position:relative;
        background:linear-gradient(160deg,rgba(255,255,255,0.115) 0%,rgba(12,17,20,0.68) 42%,rgba(9,13,16,0.76) 100%);
        backdrop-filter:blur(40px) saturate(145%);
        -webkit-backdrop-filter:blur(40px) saturate(145%);
        border:1px solid rgba(255,255,255,0.22);
        border-radius:var(--r);
        padding:clamp(16px,2vw,22px);
        box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.26);
      }
      .card.flat{
        background:rgba(13,18,21,0.56);
        backdrop-filter:blur(26px) saturate(135%);
        -webkit-backdrop-filter:blur(26px) saturate(135%);
        border:1px solid rgba(255,255,255,0.18);
        box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);
      }
      .card.hi{
        background:linear-gradient(155deg,rgba(255,255,255,0.15) 0%,rgba(12,18,21,0.74) 68%);
        border-color:rgba(255,255,255,0.30);
      }
      .card h3+p,.card h2+p{margin-top:6px}
      .sub{
        background:var(--surface2);
        backdrop-filter:blur(16px);
        -webkit-backdrop-filter:blur(16px);
        border:1px solid rgba(255,255,255,0.15);
        border-radius:var(--r2);
        padding:13px 15px;
      }
      .grid{display:grid;gap:clamp(14px,1.6vw,20px)}
      .cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
      .cols-auto{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
      .cols-wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
      .split{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
      @container main (max-width:980px){.cols2,.split{grid-template-columns:minmax(0,1fr)}}

      .btn{
        min-height:40px;
        padding:8px 16px;
        border-radius:999px;
        border:1px solid var(--line2);
        background:rgba(255,255,255,0.06);
        font-weight:500;
        font-size:13.5px;
        color:#fff;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:7px;
        white-space:nowrap;
        transition:background .2s,border-color .2s,transform .12s,box-shadow .2s;
      }
      .btn:hover{background:rgba(255,255,255,0.13);border-color:rgba(255,255,255,0.34)}
      .btn:active{transform:scale(.97)}
      .btn.p{
        background:#fff;
        border-color:#fff;
        color:#090a0c;
        font-weight:600;
        box-shadow:0 8px 24px -10px rgba(255,255,255,0.45);
      }
      .btn.p:hover{background:rgba(255,255,255,0.9)}
      .btn.ghost{
        background:transparent;
        border-color:transparent;
        color:rgba(255,255,255,0.82);
        padding-inline:8px;
      }
      .btn.ghost:hover{background:rgba(255,255,255,0.09);color:#fff}
      .btn.sm{min-height:34px;padding:5px 12px;font-size:12.5px}
      .btn.danger{color:#ff9b9b}
      .btn:disabled{opacity:.45;cursor:not-allowed}
      .btn svg{width:16px;height:16px}

      .dash-screen input,.dash-screen select,.dash-screen textarea{
        min-height:42px;
        border:1px solid var(--line2);
        background:var(--bg2);
        border-radius:12px;
        padding:8px 12px;
        width:100%;
        color:#fff;
        font-size:14px;
        transition:border-color .2s,box-shadow .2s;
      }
      .dash-screen input[type=checkbox],.dash-screen input[type=range]{width:auto;min-height:auto;padding:0;background:transparent;border:0}
      .dash-screen input:focus,.dash-screen select:focus,.dash-screen textarea:focus{
        outline:none;
        border-color:rgba(255,255,255,0.68);
        box-shadow:0 0 0 3px rgba(255,255,255,0.14);
      }
      .dash-screen textarea{line-height:1.5;resize:vertical}
      .dash-screen select option,.dash-screen select optgroup{background:#111316;color:#fff}
      label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--text2);font-weight:500}
      .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,185px),1fr));gap:12px}

      .seg{
        display:inline-flex;
        gap:2px;
        padding:4px;
        border-radius:14px;
        background:var(--bg2);
        border:1px solid var(--line);
        flex-wrap:wrap;
      }
      .seg button{
        flex:none;
        border:0;
        background:none;
        padding:7px 13px;
        border-radius:10px;
        min-height:34px;
        font-weight:500;
        font-size:13px;
        color:var(--text3);
        transition:background .22s var(--ease),color .2s;
      }
      .seg button:hover{color:#fff}
      .seg button[aria-pressed=true]{background:rgba(255,255,255,0.16);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,0.2)}

      .tabs{
        display:flex;
        gap:4px;
        border-bottom:1px solid var(--line);
        margin-bottom:20px;
        overflow-x:auto;
        scrollbar-width:none;
      }
      .tabs button{
        flex:none;
        border:0;
        background:none;
        padding:11px 16px;
        font-weight:500;
        font-size:14.5px;
        color:var(--text3);
        position:relative;
        white-space:nowrap;
        transition:color .2s;
      }
      .tabs button::after{
        content:"";
        position:absolute;
        left:12px;
        right:12px;
        bottom:-1px;
        height:2.5px;
        border-radius:3px;
        background:#fff;
        transform:scaleX(0);
        transition:transform .3s var(--ease);
      }
      .tabs button[aria-selected=true]{color:#fff;font-weight:600}
      .tabs button[aria-selected=true]::after{transform:none}
      .tabs button:hover{color:#fff}
      .tabs .count{
        display:inline-grid;
        place-items:center;
        min-width:19px;
        height:19px;
        padding:0 6px;
        border-radius:10px;
        background:var(--bad);
        color:#fff;
        font-size:11.5px;
        margin-left:6px;
      }

      .chips{display:flex;flex-wrap:wrap;gap:8px}
      .chip{
        border:1px solid var(--line2);
        background:rgba(255,255,255,0.04);
        border-radius:999px;
        padding:6px 14px;
        font-size:13.5px;
        min-height:36px;
        color:#fff;
        transition:all .2s var(--ease);
      }
      .chip:hover{border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.1)}
      .chip[aria-pressed=true]{background:#fff;border-color:#fff;color:#090a0c;font-weight:600}

      .st{
        display:inline-flex;
        gap:7px;
        align-items:center;
        font-size:12.5px;
        font-weight:600;
        white-space:nowrap;
        padding:3px 10px 3px 4px;
        border-radius:999px;
        background:rgba(255,255,255,0.06);
      }
      .st i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff;flex:none}
      .l0{color:#8ee2b4}.l0 i{background:var(--ok)}
      .l1{color:#ffd88c}.l1 i{background:var(--warn);color:#2a1d00}
      .l2{color:#ffaaaa}.l2 i{background:var(--bad)}
      .ln_{color:var(--text3)}.ln_ i{background:var(--none)}
      .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

      .banner{
        border-radius:var(--r2);
        padding:13px 16px;
        display:flex;
        gap:12px;
        align-items:flex-start;
        border:1px solid;
        animation:pop .35s var(--ease);
      }
      .banner.l2{background:rgba(239,91,91,0.12);border-color:rgba(239,91,91,0.42);color:#fff}
      .banner.l1{background:rgba(245,185,65,0.10);border-color:rgba(245,185,65,0.36);color:#fff}
      .banner.l0{background:rgba(52,194,122,0.10);border-color:rgba(52,194,122,0.36);color:#fff}
      .pill{display:inline-block;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,0.09);color:var(--text2)}

      .dash-screen hr{border:0;border-top:1px solid var(--line);margin:16px 0}
      .dash-screen ul.acts{margin:6px 0 0;padding-left:20px}
      .dash-screen ul.acts li{margin:5px 0}
      .dash-screen table{width:100%;border-collapse:collapse;font-size:14px}
      .dash-screen th,.dash-screen td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
      .dash-screen th{font-size:12.5px;color:var(--text3);font-weight:600;letter-spacing:.2px}
      .dash-screen td.r,.dash-screen th.r{text-align:right}
      .dash-screen tbody tr{transition:background .15s}
      .dash-screen tbody tr:hover{background:rgba(255,255,255,0.035)}
      .scroll{overflow-x:auto}
      @container main (max-width:700px){
        .rtable thead{display:none}
        .rtable tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
        .rtable td{border:0;padding:2px 0}
        .rtable td[data-l]::before{content:attr(data-l) ": ";color:var(--text3);font-size:12.5px}
        .rtable td.full{grid-column:1/-1}
        .rtable td.r{text-align:left}
      }

      .kpi{display:flex;flex-direction:column;gap:2px}
      .kpi b{font:600 clamp(22px,2.4vw,30px) var(--hf);line-height:1.1}
      .kpi span{font-size:12.5px;color:var(--text3)}
      .kpis{display:flex;gap:clamp(16px,3vw,34px);flex-wrap:wrap}
      .empty{text-align:center;padding:32px 16px;color:var(--text3)}
      .bar{height:8px;border-radius:6px;background:rgba(255,255,255,0.09);overflow:hidden}
      .bar > i{display:block;height:100%;background:var(--grad);border-radius:6px;transform-origin:left;animation:grow .9s var(--ease) both}

      /* Monitor Overview: Body SVG + Gauge + Attention + Glass-Tile Body Systems Grid */
      .overview{display:grid;gap:clamp(14px,1.6vw,22px);grid-template-columns:minmax(300px,.95fr) minmax(0,1.25fr)}
      @container main (max-width:880px){.overview{grid-template-columns:minmax(0,1fr)}}
      .bodycard{position:sticky;top:22px;display:flex;flex-direction:column;gap:10px;align-self:start}
      @container main (max-width:880px){.bodycard{position:relative;top:0}}
      .bodystage{position:relative;display:grid;place-items:center;padding:6px 0}
      .bodystage svg{width:100%;max-width:340px;height:auto;max-height:calc(100vh - 280px);min-height:400px;overflow:visible}
      .reg{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .28s var(--ease),filter .28s,opacity .28s;outline:none}
      .reg:hover,.reg:focus-visible,.reg.hl{transform:scale(1.13);filter:drop-shadow(0 0 7px currentColor) brightness(1.25)}
      .bodystage:hover .reg:not(:hover):not(.hl){opacity:.62}
      .reg .hit{pointer-events:stroke}
      .reg .hit-fill{pointer-events:all}
      .btip{
        position:absolute;
        pointer-events:none;
        z-index:4;
        width:250px;
        background:rgba(12,14,18,0.92);
        backdrop-filter:blur(20px);
        border:1px solid var(--line2);
        border-radius:14px;
        padding:12px 14px;
        box-shadow:0 18px 40px rgba(0,0,0,0.6);
        opacity:0;
        transform:translateY(6px);
        transition:opacity .18s,transform .18s;
      }
      .btip.on{opacity:1;transform:none}
      .btip b{font:600 15px var(--hf);display:block;margin-bottom:3px}
      .legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--text2)}
      .legend span{display:inline-flex;gap:6px;align-items:center}

      .score{display:flex;align-items:center;gap:18px}
      .gauge{width:108px;height:108px;flex:none;position:relative}
      .gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
      .gauge circle{fill:none;stroke-width:9.5}
      .gauge .trk{stroke:rgba(255,255,255,0.1)}
      .gauge .val{stroke:url(#gg);stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
      .gauge b{position:absolute;inset:0;display:grid;place-items:center;font:600 30px var(--font-mono)}
      .counts{display:flex;gap:8px;flex-wrap:wrap}
      .count{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:12px;background:var(--surface2);border:1px solid rgba(255,255,255,0.08);font-size:13.5px}
      .count b{font:600 18px var(--font-mono)}

      /* GSAP-inspired .glass-tile micro-interaction for Condition Grid & Live Tiles */
      .glass-tile{
        --gx:50%;
        --gy:50%;
        position:relative;
        overflow:hidden;
        transform-origin:center center;
        will-change:transform;
        transition:transform .36s cubic-bezier(0.22,1,0.36,1),
                   background .28s cubic-bezier(0.22,1,0.36,1),
                   border-color .28s cubic-bezier(0.22,1,0.36,1),
                   box-shadow .32s cubic-bezier(0.22,1,0.36,1);
      }
      .glass-tile > *{position:relative;z-index:1}
      .glass-tile::after{
        content:"";
        position:absolute;
        inset:0;
        z-index:0;
        border-radius:inherit;
        pointer-events:none;
        opacity:0;
        background:
          radial-gradient(125px circle at var(--gx) var(--gy), rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.08) 46%, transparent 78%),
          radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,0.10) 0%, transparent 65%);
        transition:opacity .32s cubic-bezier(0.22,1,0.36,1);
      }
      .glass-tile:hover,.glass-tile:focus-visible{
        z-index:2;
        transform:translate3d(0,-1.5px,0) scale(1.032);
        background:rgba(255,255,255,0.085);
        border-color:rgba(255,255,255,0.32);
        box-shadow:0 10px 24px -8px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.25), inset 0 0 18px rgba(255,255,255,0.09);
        outline:none;
      }
      .glass-tile:hover::after,.glass-tile:focus-visible::after{opacity:1}
      .glass-tile:active{transform:translate3d(0,0,0) scale(0.982);transition-duration:.12s}
      .glass-tile.just-selected{animation:cond-tile-pulse .42s cubic-bezier(0.22,1,0.36,1) both}

      .syslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,205px),1fr));gap:8px}
      .sys{
        display:flex;
        align-items:center;
        gap:10px;
        padding:11px 12px;
        border-radius:14px;
        background:var(--surface2);
        border:1px solid rgba(255,255,255,0.09);
        color:#fff;
        text-align:left;
        cursor:pointer;
        position:relative;
        overflow:hidden;
        transition:transform .22s cubic-bezier(0.22,1,0.36,1), background .22s, border-color .22s, box-shadow .22s;
      }
      .sys:hover,.sys:focus-visible{
        transform:translate3d(0,-2px,0) scale(1.025);
        background:rgba(255,255,255,0.11);
        border-color:rgba(255,255,255,0.34);
        box-shadow:0 8px 22px -6px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.28);
        outline:none;
      }
      .sys:active{
        transform:translate3d(0,0,0) scale(0.985);
        transition-duration:.1s;
      }
      .sys .nm{flex:1;font-weight:600;font-size:14px;line-height:1.25}
      .sys .nm small{display:block;font-weight:400;font-size:12px;color:var(--text3);margin-top:2px}

      .att{border:1px solid var(--line);border-radius:16px;background:var(--surface2);overflow:hidden;transition:border-color .2s}
      .att[open]{border-color:var(--line2)}
      .att summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer}
      .att summary::-webkit-details-marker{display:none}
      .att summary .chev{transition:transform .3s var(--ease);color:var(--text3)}
      .att[open] summary .chev{transform:rotate(180deg)}
      .att .body{padding:0 15px 15px;animation:rise .35s var(--ease)}

      .guide{border-radius:14px;padding:13px 15px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.2);margin-top:10px}
      .guide h4{font:600 14.5px var(--hf);color:#fff;margin-bottom:6px}
      .guide li{font-size:14px}
      .suprow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;padding:7px 0;border-top:1px dashed var(--line2)}

      .tile{
        border:1px solid rgba(255,255,255,0.20);
        background:linear-gradient(160deg,rgba(255,255,255,0.10) 0%,rgba(11,16,19,0.68) 58%);
        backdrop-filter:blur(32px) saturate(140%);
        -webkit-backdrop-filter:blur(32px) saturate(140%);
        border-radius:18px;
        padding:15px;
        display:flex;
        flex-direction:column;
        gap:6px;
        text-align:left;
        width:100%;
        color:#fff;
        box-shadow:0 14px 34px -18px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.22);
      }
      .tile .lab{font-size:13.5px;color:var(--text2);font-weight:500}
      .tile .v{font:600 32px var(--font-mono);line-height:1.1}
      .tile .v small{font:500 13px var(--hf);color:var(--text3);margin-left:5px}
      .tile.flash{animation:flash .6s var(--ease)}
      .spark{height:40px;width:100%}
      .live{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--text2)}
      .live i{width:10px;height:10px;border-radius:50%;background:var(--none)}
      .live.on i{background:var(--bad);box-shadow:0 0 0 0 rgba(239,91,91,0.6);animation:ping 1.4s infinite}
      .bat-widget{
        border:1px solid rgba(255,255,255,0.18);
        background:linear-gradient(155deg,rgba(255,255,255,0.09) 0%,rgba(11,16,19,0.68) 65%);
        border-radius:16px;
        padding:14px 16px;
        margin-top:16px;
        display:flex;
        flex-direction:column;
        gap:10px;
      }
      .bat-widget svg{
        width:20px;
        height:20px;
        flex:none;
        color:var(--text2);
      }
      .bat-widget.is-low{
        border-color:rgba(239,91,91,0.52);
        background:linear-gradient(155deg,rgba(239,91,91,0.16) 0%,rgba(16,12,14,0.76) 72%);
      }
      .bat-bar{
        position:relative;
        height:10px;
        border-radius:999px;
        background:rgba(255,255,255,0.1);
        overflow:hidden;
      }
      .bat-fill{
        height:100%;
        border-radius:999px;
        transition:width .6s var(--ease), background .35s;
      }

      .mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
      .mitem{
        display:flex;
        align-items:center;
        gap:12px;
        padding:11px 14px;
        border-radius:14px;
        background:var(--surface2);
        border:1px solid rgba(255,255,255,0.09);
        color:#fff;
        text-align:left;
        width:100%;
        transition:border-color .2s,background .2s;
      }
      .mitem:hover{border-color:var(--line2);background:var(--surface3)}
      .mitem .nm{flex:1;font-weight:600;font-size:14px}
      .mitem .nm small{display:block;font-weight:400;color:var(--text3);font-size:12.5px}
      .mitem .vv{text-align:right;font:600 17px var(--font-mono)}
      .mitem .vv small{display:block;font:400 12px var(--hf);color:var(--text3)}

      /* Trajectory Chart */
      .fig{position:relative;min-height:320px}
      .fig > svg{position:absolute;inset:0;width:100%;height:100%}
      .tip{
        position:absolute;
        pointer-events:none;
        background:#fff;
        color:#0d0e11;
        font-size:12.5px;
        padding:8px 10px;
        border-radius:10px;
        white-space:nowrap;
        display:none;
        z-index:2;
        box-shadow:0 10px 24px rgba(0,0,0,0.5);
      }
      .clegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text2)}
      .clegend span{display:inline-flex;gap:6px;align-items:center}
      .sw{width:18px;height:10px;border-radius:3px;display:inline-block}

      /* Routine, PVT, Badges, Journal, Rash, Supplies */
      .pvt{
        height:220px;
        border-radius:18px;
        background:var(--bg2);
        border:1px solid var(--line2);
        display:grid;
        place-items:center;
        user-select:none;
        cursor:pointer;
        touch-action:manipulation;
        font:600 22px var(--font-mono);
        transition:background .15s,color .15s;
      }
      .pvt.go{background:#fff;color:#090a0c}
      .badge{border:1px solid var(--line);border-radius:16px;padding:13px;font-size:13.5px;background:var(--surface2);transition:transform .2s var(--ease)}
      .badge.on{border-color:rgba(255,255,255,0.42);background:rgba(255,255,255,0.12)}
      .badge:hover{transform:translateY(-2px)}
      .thumb{width:68px;height:52px;object-fit:cover;border-radius:10px;border:1px solid var(--line2)}
      .jentry{border:1px solid var(--line);border-radius:16px;padding:13px 15px;background:var(--surface2);white-space:pre-wrap;animation:rise .4s var(--ease) both}
      .lock{display:grid;place-items:center;text-align:center;gap:16px;padding:42px 16px}
      .task{display:flex;align-items:center;gap:14px;padding:11px 4px;border-bottom:1px solid var(--line)}
      .task .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:all .3s var(--ease)}
      .task.done .ck{background:var(--ok);border-color:var(--ok)}
      .task.done .tn{color:var(--text3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.28)}
      .task .tn{flex:1;font-weight:500}
      .meal{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
      @container main (max-width:600px){.meal{grid-template-columns:minmax(0,1fr) auto}.meal .mt{grid-column:1/-1}}
      .exb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}
      .exb .ic{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,0.1);display:grid;place-items:center;color:#fff}
      .week{display:flex;flex-direction:column;gap:6px}
      .week div{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--surface2);font-size:13.5px;color:var(--text2)}
      .week div b{font:600 12.5px var(--font-mono);color:var(--text3);width:48px;flex:none}
      .week div.on{background:#fff;color:#090a0c;font-weight:600}
      .week div.on b{color:#090a0c}

      .shelf{border:1px solid rgba(255,255,255,0.22);border-radius:18px;background:linear-gradient(165deg,rgba(255,255,255,0.10) 0%,rgba(11,16,19,0.70) 55%);backdrop-filter:blur(36px) saturate(140%);-webkit-backdrop-filter:blur(36px) saturate(140%);overflow:hidden;margin-bottom:14px;animation:rise .4s var(--ease) both}
      .shelf > summary,.catg > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px}
      .shelf > summary::-webkit-details-marker,.catg > summary::-webkit-details-marker{display:none}
      .shelf > summary{padding:15px 18px;background:linear-gradient(90deg,rgba(255,255,255,0.09),transparent)}
      .shelf > summary h3{flex:1}
      .catg{border-top:1px solid var(--line)}
      .catg > summary{padding:11px 18px 11px 28px;font-weight:600;color:var(--text2)}
      .catg > summary .grow{color:#fff}
      .chev{transition:transform .3s var(--ease);flex:none}
      details[open] > summary .chev{transform:rotate(90deg)}
      .items{padding:0 12px 10px 28px}
      .irow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(70px,.8fr) minmax(70px,.7fr) minmax(64px,.6fr) minmax(0,1.9fr) auto;gap:10px;align-items:center;padding:10px 8px;border-radius:12px;transition:background .15s}
      .irow:hover{background:rgba(255,255,255,0.04)}
      .irow.head{font-size:12px;color:var(--text3);font-weight:600;padding-top:4px;padding-bottom:4px}
      .irow .nm{font-weight:600}
      .irow .nm small{display:block;font-weight:400;font-size:12px;color:var(--text3)}
      @container main (max-width:860px){
        .irow{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
        .irow.head{display:none}
        .irow > .c-stock,.irow > .c-use,.irow > .c-last{font-size:13.5px;color:var(--text2)}
        .irow > .c-stat,.irow > .c-act{grid-column:1/-1;justify-content:flex-start}
      }
      .irow .c-act{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
      .rename{background:none;border:0;color:var(--text3);padding:4px;border-radius:8px}
      .rename:hover{color:#fff;background:rgba(255,255,255,0.1)}

      .qrow{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
      .qnote{display:flex;gap:8px;align-items:stretch}
      .qnote input,.qnote textarea{flex:1}
      .micbtn{width:42px;flex:none;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);display:grid;place-items:center;color:var(--text2)}
      .micbtn svg{width:18px;height:18px}
      .micbtn.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:ping 1.4s infinite}
      .micbtn.transcribing{opacity:.65;cursor:wait}

      .ring{--p:0;width:40px;height:40px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,0.16) 0);display:grid;place-items:center;flex:none}
      .ring i{width:30px;height:30px;border-radius:50%;background:#101215;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:#fff}

      .btab{width:100%;border-collapse:separate;border-spacing:0}
      .btab th{font-weight:600;text-align:left;padding:10px;font-size:12.5px;background:rgba(16,18,22,0.96);position:sticky;top:0;z-index:1;color:var(--text2)}
      .btab td{padding:7px 10px;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,0.1)}
      .btab input{min-height:36px;text-align:right}
      .btab tr.filled input{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.34)}

      /* Input Method Switcher & Fieldsets */
      .imwrap{display:flex;flex-direction:column;gap:10px;margin-top:12px}
      .imbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:4px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
      .imbar button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:38px;border-radius:10px;border:0;background:transparent;color:var(--text2);font-weight:500;font-size:13px;transition:background .2s,color .2s}
      .imbar button svg{width:16px;height:16px;flex:none}
      .imbar button:hover{color:#fff}
      .imbar button[aria-pressed=true]{background:rgba(255,255,255,0.16);color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,0.22)}
      @container main (max-width:520px){.imbar button span{display:none}}
      .impane{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px dashed var(--line2);animation:rise .3s var(--ease)}
      .impane .btn{align-self:flex-start}
      .imout:empty{display:none}
      label.f.hl input,label.hl input{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.2);animation:filled 1.6s var(--ease)}
      .ciset{border:1px solid var(--line);border-radius:16px;padding:12px 16px 16px;margin:0}
      .ciset legend{padding:0 8px;font:600 12px var(--hf);letter-spacing:.7px;text-transform:uppercase;color:var(--text3)}
      h4 > svg{width:17px;height:17px;vertical-align:-3px;margin-right:6px;color:rgba(255,255,255,0.8)}

      /* Drawer, Modal, Toast */
      .scrim{position:fixed;inset:0;background:rgba(4,5,8,0.6);backdrop-filter:blur(4px);z-index:20;opacity:0;pointer-events:none;transition:opacity .3s}
      .scrim.on{opacity:1;pointer-events:auto}
      .drawer{
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        width:min(620px,100vw);
        background:rgba(12,14,18,0.88);
        backdrop-filter:blur(40px);
        -webkit-backdrop-filter:blur(40px);
        border-left:1px solid var(--line2);
        z-index:21;
        overflow:auto;
        padding:22px clamp(16px,2.4vw,28px);
        transform:translateX(104%);
        transition:transform .4s var(--ease);
        box-shadow:-20px 0 60px rgba(0,0,0,0.65);
      }
      .drawer.on{transform:none}
      .dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
      .modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:rgba(4,5,8,0.66);backdrop-filter:blur(6px);padding:16px;opacity:0;pointer-events:none;transition:opacity .25s}
      .modal.on{opacity:1;pointer-events:auto}
      .modal.on .mcard{animation:pop .3s var(--ease)}
      .mcard{
        background:rgba(14,16,20,0.92);
        backdrop-filter:blur(36px);
        -webkit-backdrop-filter:blur(36px);
        border:1px solid var(--line2);
        border-radius:20px;
        padding:22px;
        max-width:760px;
        width:100%;
        max-height:88vh;
        overflow:auto;
        box-shadow:0 30px 70px rgba(0,0,0,0.72);
      }
      .toast{
        position:fixed;
        left:50%;
        bottom:22px;
        transform:translate(-50%,20px);
        background:#fff;
        color:#0d0e11;
        padding:11px 18px;
        border-radius:999px;
        z-index:40;
        max-width:92vw;
        box-shadow:0 14px 40px rgba(0,0,0,0.55);

      .g-ttt button:hover:not(:disabled){background:var(--surface3);border-color:var(--line2);transform:translateY(-2px)}
      .g-ttt button.win{background:rgba(52,194,122,0.22);border-color:var(--ok);color:#fff}
      .g-mem{display:grid;grid-template-columns:repeat(4,minmax(0,78px));gap:10px;justify-content:center;margin:14px auto}
      .g-mem button{height:78px;border-radius:15px;border:1px solid var(--line);background:var(--surface2);backdrop-filter:blur(16px);color:#fff;display:grid;place-items:center;transition:transform .2s var(--ease),background .2s,border-color .2s}
      .g-mem button:hover:not(:disabled){border-color:var(--line2);background:var(--surface3);transform:translateY(-2px)}

      .g-mem button.match{background:rgba(52,194,122,0.18);border-color:rgba(52,194,122,0.55);color:var(--ok)}
      .g-mem button svg{width:28px;height:28px}
      .g-2048{display:grid;grid-template-columns:repeat(4,minmax(0,76px));gap:9px;padding:10px;border-radius:18px;background:var(--bg2);border:1px solid var(--line);width:max-content;margin:14px auto}
      .g-2048 .cell{height:76px;width:76px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);display:grid;place-items:center;font:700 22px var(--font-mono);color:#fff;transition:background .15s,transform .15s}
      .g-2048 .cell.v2{background:rgba(255,255,255,0.11)}
      .g-2048 .cell.v4{background:rgba(255,255,255,0.17)}
      .g-2048 .cell.v8{background:rgba(52,194,122,0.22);border-color:rgba(52,194,122,0.42)}
      .g-2048 .cell.v16{background:rgba(52,194,122,0.34);border-color:rgba(52,194,122,0.58)}
      .g-2048 .cell.v32{background:rgba(245,185,65,0.28);border-color:rgba(245,185,65,0.54)}
      .g-2048 .cell.v64{background:rgba(245,185,65,0.40);border-color:rgba(245,185,65,0.68)}
      .g-2048 .cell.v128,.g-2048 .cell.v256,.g-2048 .cell.v512,.g-2048 .cell.v1024,.g-2048 .cell.v2048{background:rgba(255,255,255,0.88);color:#0a0d10;border-color:#fff}
      .g-dpad{display:grid;grid-template-columns:repeat(3,44px);gap:6px;justify-content:center;margin-top:12px}
      .g-dpad button{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:#fff;font-weight:600}
      .g-dpad button:hover{background:var(--surface3);border-color:var(--line2)}
      .g-canvas-wrap{display:flex;justify-content:center;margin:14px 0}
      .g-canvas{border-radius:16px;border:1px solid var(--line2);background:rgba(6,10,12,0.82);max-width:100%;height:auto;display:block}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes wave-idle{0%,100%{height:6px;opacity:.45}50%{height:12px;opacity:.75}}
      .waveform span{width:4px;height:6px;border-radius:999px;background:rgba(121,220,232,0.55);transition:height .1s ease,background .2s ease}
      .waveform.recording span{background:var(--bad)}
      #botMic.recording{background:var(--bad);border-color:var(--bad);color:#fff;animation:ping 1.4s infinite}
      .tars-transcript{width:100%;margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,0.06);border:1px solid var(--line);text-align:left;font-size:13px;color:var(--text2);display:none}

      @media (prefers-reduced-motion:reduce){

        .glass-tile:hover,.glass-tile:focus-visible,.glass-tile:active{transform:none}
